[project]
name = "hausaufgaben"
version = "0.1.0"
description = "Neue Hausaufgaben aus Schulmanager Online in eine WhatsApp-Gruppe posten"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "requests>=2.32",
    # Muss aktuell bleiben: WhatsApp lehnt alte whatsmeow-Builds mit 405 ab.
    "neonize>=0.4.3",
    "pydantic-ai-slim[openai]>=2.55",
]

[project.scripts]
hausaufgaben = "hausaufgaben.cli:main"
vokabeln-sprechen = "hausaufgaben.sprechen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hausaufgaben"]
